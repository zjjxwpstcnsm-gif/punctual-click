name: Import Complete Punctual Source

# One-shot repository bootstrap. The workflow deletes itself after a successful import.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified source mirror
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch punctual-publish-staging-20260818 \
            https://github.com/zjjxwpstcnsm-gif/pasteguard.git \
            /tmp/punctual-source-mirror
          test -f /tmp/punctual-source-mirror/exports/source-tree/Cargo.toml
          test -f /tmp/punctual-source-mirror/exports/source-tree/Cargo.lock
          rsync -a /tmp/punctual-source-mirror/exports/source-tree/ ./

      - name: Validate imported project
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version = "0.1.0-alpha.5"' Cargo.toml
          python3 scripts/rust-delimiter-check.py
          python3 scripts/project-consistency-check.py
          node --check scripts/detect_buttons.js
          node --check scripts/highlight_button.js
          node --check scripts/probe_target.js
          test -f .github/workflows/release.yml
          test -f packaging/macos/build-release.sh
          test -f packaging/windows/build-release.ps1
          test -f RELEASE_NOTES.md

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          chmod +x packaging/macos/build-release.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git update-index --chmod=+x packaging/macos/build-release.sh
          if git diff --cached --quiet; then
            echo "Complete source tree is already present"
            exit 0
          fi
          git commit -m "feat: import complete Punctual 0.1.0-alpha.5 source"
          git push origin HEAD:main

name: Ensure Public Release

on:
  push:
    branches: [main]
    paths:
      - ".release/ensure-v0.1.0-alpha.5"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: ensure-punctual-v0.1.0-alpha.5-release
  cancel-in-progress: true

jobs:
  ensure-release:
    name: Ensure visible GitHub Release
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/ensure-release v0.1.0-alpha.5')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.5
      VERSION: 0.1.0-alpha.5
      SOURCE_RUN_ID: '32098863890'
      REPORT_ISSUE: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Report start
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments" \
            -f body="Release visibility repair started.\n\nWorkflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Download verified installers from the successful build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true

      - name: Verify installer set and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          required=(
            "Punctual-${VERSION}-macos-arm64.dmg"
            "Punctual-${VERSION}-macos-arm64.dmg.sha256"
            "Punctual-${VERSION}-windows-x64-setup.exe"
            "Punctual-${VERSION}-windows-x64-portable.zip"
            "Punctual-${VERSION}-windows-x64-SHA256SUMS.txt"
          )

          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done

          expected_macos="$(awk '{print $1}' "Punctual-${VERSION}-macos-arm64.dmg.sha256")"
          actual_macos="$(sha256sum "Punctual-${VERSION}-macos-arm64.dmg" | awk '{print $1}')"
          test "$expected_macos" = "$actual_macos"

          sha256sum -c "Punctual-${VERSION}-windows-x64-SHA256SUMS.txt"
          sha256sum \
            "Punctual-${VERSION}-macos-arm64.dmg" \
            "Punctual-${VERSION}-windows-x64-setup.exe" \
            "Punctual-${VERSION}-windows-x64-portable.zip" \
            > SHA256SUMS.txt

      - name: Create or promote the Release and attach installers
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --latest \
              --title "Punctual v${VERSION}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target main \
              --latest \
              --title "Punctual v${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi

          gh release upload "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          release_json="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,assets)"
          echo "$release_json" | jq .
          echo "$release_json" | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null

          required_assets=(
            "Punctual-${VERSION}-macos-arm64.dmg"
            "Punctual-${VERSION}-macos-arm64.dmg.sha256"
            "Punctual-${VERSION}-windows-x64-setup.exe"
            "Punctual-${VERSION}-windows-x64-portable.zip"
            "Punctual-${VERSION}-windows-x64-SHA256SUMS.txt"
            "SHA256SUMS.txt"
          )
          for asset in "${required_assets[@]}"; do
            echo "$release_json" | jq -e --arg asset "$asset" '.assets | any(.name == $asset)' >/dev/null
          done

          echo "url=$(echo "$release_json" | jq -r '.url')" >> "$GITHUB_OUTPUT"

      - name: Report result
        shell: bash
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${REPORT_ISSUE}/comments" \
            -f body="Punctual v${VERSION} is now a normal, visible Latest Release with verified macOS and Windows installer assets.\n\nRelease: ${RELEASE_URL}"

name: Owner Format Source Command

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.title == '[maintenance] Format Punctual source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out owner branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and validate Rust source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rust source is already formatted"
          else
            git commit -m "style: format Rust source"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
